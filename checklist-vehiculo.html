    // ---- Diagrama de daños del vehículo (4 ángulos, siluetas genéricas de referencia) ----
    const CANVAS_W = 300;

    const SVG_FRENTE = `<svg viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">

    const SVG_ATRAS = `<svg viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">
      <rect x="60" y="40" width="180" height="100" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>

      <rect x="75" y="60" width="14" height="30" rx="3" fill="#ff6b6b" stroke="#495057" stroke-width="1"/>
      <rect x="211" y="60" width="14" height="30" rx="3" fill="#ff6b6b" stroke="#495057" stroke-width="1"/>
      <rect x="130" y="118" width="40" height="14" rx="2" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
      <circle cx="90" cy="130" r="18" fill="#212529"/>
      <circle cx="210" cy="130" r="18" fill="#212529"/>
    </svg>`;

    const SVG_LATERAL = `<svg viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 120 L30 90 Q30 75 45 70 L80 70 L100 40 L200 40 Q220 40 225 60 L255 70 Q270 72 270 90 L270 120 Z"
            fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
      <path d="M105 45 L95 68 L150 68 L150 45 Z" fill="#dbe4ff" stroke="#495057" stroke-width="1.5"/>
      <path d="M155 45 L195 45 L215 68 L155 68 Z" fill="#dbe4ff" stroke="#495057" stroke-width="1.5"/>
      <circle cx="80" cy="125" r="20" fill="#212529"/>
      <circle cx="80" cy="125" r="8" fill="#868e96"/>
      <circle cx="220" cy="125" r="20" fill="#212529"/>
      <circle cx="220" cy="125" r="8" fill="#868e96"/>
      <rect x="95" y="90" width="14" height="8" rx="2" fill="#adb5bd" stroke="#495057" stroke-width="1"/>
    </svg>`;

    const ANGULOS_VEHICULO = [
      { key: 'frente', label: 'Frente', svg: SVG_FRENTE, espejado: false },
      { key: 'atras', label: 'Atrás', svg: SVG_ATRAS, espejado: false },
      { key: 'lateralDerecho', label: 'Costado Derecho', svg: SVG_LATERAL, espejado: false },
      { key: 'lateralIzquierdo', label: 'Costado Izquierdo', svg: SVG_LATERAL, espejado: true },
    ];

    function svgDataUrl(angulo) {
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(angulo.svg);
    }

    function cargarImagen(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = src;
      });
    }

    // Rasteriza la silueta base (SVG) a PNG, respetando el espejado para costado izquierdo
    async function svgToPngDataUrl(angulo) {
      const img = await cargarImagen(svgDataUrl(angulo));
      const c = document.createElement('canvas');
      c.width = CANVAS_W;
      c.height = CANVAS_H;
      const ctx = c.getContext('2d');
      if (angulo.espejado) {
        ctx.save();
        ctx.translate(CANVAS_W, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);
        ctx.restore();
      } else {
        ctx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);
      }
      return c.toDataURL('image/png');
    }

    function crearEstadoInicial() {
      const form = {
        nombreTecnico: '',
        fecha: new Date().toISOString().slice(0, 10),
        patente: 'TZ-WS-55',
        ciudad: 'Valparaíso',
        proyecto: 'Chilquinta',
        kmActual: '',
        observaciones: '',
      };
      SECCIONES.forEach((section) => {
        form[section.key] = {};
        section.items.forEach((item) => {
          form[section.key][item.key] = false;
        });
      });

      form.seguridad = {};
      SEGURIDAD_ITEMS.forEach((item) => {
        form.seguridad[item.key] = 'buen';
      });

      return form;
    }

    function formatearFecha(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      return `${d}-${m}-${y}`;
    }

    const ChecklistVehiculo = {
      template: `
        <div class="checklist">
          <div class="card shadow-sm checklist__card">
            <div class="card-body">
              <h1 class="checklist__title h4 mb-1">Check List Vehículos Provectis</h1>
              <p class="checklist__subtitle text-muted mb-4">Formato N°1</p>

              <div class="row g-3 mb-4">
                <div class="col-md-6">

                </div>

                    <button class="btn btn-success" type="button" @click="guardarUltimaMantencion">
                      Guardar
                    </button>
                    <button class="btn btn-outline-secondary" type="button" @click="editandoUltimaMantencion = false">
                      Cancelar
                    </button>
                  </div>
                </div>
                <div class="col-md-3">
                  <label class="form-label checklist__label d-block">KM Próxima Mantención</label>
                  <div v-if="!editandoKmProxima" class="checklist__km-proxima">
                    <span class="checklist__km-proxima-valor">
                      {{ kmProximaMantencion.toLocaleString('es-CL') }} km
                    </span>
                    <button
                      type="button"
                      class="btn btn-link btn-sm p-0 ms-2"
                      @click="abrirEdicionKmProxima"
                    >
                      Actualizar
                    </button>
                  </div>
                  <div v-else class="input-group input-group-sm">
                    <input
                      v-model.number="kmProximaEditVal"
                      type="number"

                    <button class="btn btn-success" type="button" @click="guardarKmProxima">

                    <button class="btn btn-outline-secondary" type="button" @click="editandoKmProxima = false">

                    </button>

                </div>
              </div>

              <div
                v-if="alertaMantencion"

                KM actual: <strong>{{ form.kmActual.toLocaleString('es-CL') }} km</strong>. Agendar mantención.

              <div class="mb-4">

                </h2>
                <p class="text-muted small mb-2">

                <div class="row row-cols-2 g-3">

                      <div class="checklist__danos-actions mt-1">

              </div>

              <div class="mb-4">
                <h2 class="checklist__section-title h6 text-uppercase text-muted mb-2">
                  Seguridad del Vehículo
                </h2>
                <div class="checklist__section-list checklist__section-list--radio">
                  <div class="row checklist__radio-header text-muted small mb-1">
                    <div class="col-6"></div>
                    <div class="col-2 text-center">Buen Estado</div>
                    <div class="col-2 text-center">Regular</div>
                    <div class="col-2 text-center">Mal Estado</div>
                  </div>
                  <div
                    v-for="item in seguridadItems"

                    class="row checklist__check-row align-items-center"
                  >
                    <div class="col-6">{{ item.label }}</div>
                    <div class="col-2 text-center">
                      <input
                        class="form-check-input"
                        type="radio"
                        :name="'seguridad-' + item.key"
                        value="buen"
                        v-model="form.seguridad[item.key]"
                      />
                    </div>
                    <div class="col-2 text-center">
                      <input
                        class="form-check-input"
                        type="radio"
                        :name="'seguridad-' + item.key"
                        value="regular"
                        v-model="form.seguridad[item.key]"
                      />
                    </div>
                    <div class="col-2 text-center">
                      <input
                        class="form-check-input"
                        type="radio"
                        :name="'seguridad-' + item.key"
                        value="mal"
                        v-model="form.seguridad[item.key]"
                      />
                    </div>
                  </div>
                </div>
              </div>

              <div class="row g-4 mb-3">
                <div class="col-md-6" v-for="section in checkboxSections" :key="section.key">

                    <input
                      class="form-check-input me-2"
                      type="checkbox"
                      :id="section.key + '-all'"
                      :checked="isSectionAllChecked(section)"

                    />
                    <label

                      :for="section.key + '-all'"

                      {{ section.label }}

                  </div>
                  <div class="checklist__section-list">
                    <div
                      v-for="item in section.items"
                      :key="item.key"
                      class="form-check checklist__check-row"
                    >
                      <input
                        class="form-check-input"
                        type="checkbox"
                        :id="section.key + '-' + item.key"
                        v-model="form[section.key][item.key]"
                      />
                      <label class="form-check-label" :for="section.key + '-' + item.key">
                        {{ item.label }}
                      </label>
                    </div>
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label checklist__label">Observaciones</label>
                <textarea
                  v-model="form.observaciones"
                  class="form-control"
                  rows="3"
                  placeholder="Cualquier anomalía o siniestro que tenga el vehículo"
                ></textarea>
              </div>

              <hr />

              <button type="button" class="btn btn-primary checklist__pdf-btn" @click="generarPDF">
                Generar PDF
              </button>
              <span v-if="generando" class="checklist__pdf-status text-muted ms-2">Generando…</span>

              <div class="mt-4 checklist__historial">
                <h2 class="h6 text-uppercase text-muted mb-2">Historial de Checklists</h2>

                <p v-if="!firebaseListo" class="text-muted small">
                  El historial en la nube está desactivado: falta configurar
                  <code>firebaseConfig</code> en el código (ver README).
                </p>

                <p v-else-if="!historial.length" class="text-muted small">
                  Aún no hay checklists guardados.
                </p>

                <div v-else class="table-responsive">
                  <table class="table table-sm table-hover align-middle">
                    <thead>
                      <tr>
                        <th>Fecha</th>
                        <th>Patente</th>
                        <th>KM Actual</th>
                        <th>Técnico</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr v-for="entry in historial" :key="entry.id">
                        <td>{{ entry.fecha }}</td>
                        <td>{{ entry.patente }}</td>
                        <td>{{ entry.kmActual }}</td>
                        <td>{{ entry.nombreTecnico }}</td>
                        <td class="text-end">
                          <button
                            class="btn btn-sm btn-outline-secondary"
                            @click="descargarDesdeHistorial(entry)"
                          >
                            Descargar PDF
                          </button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      `,
      setup() {
        const form = reactive(crearEstadoInicial());
        const checkboxSections = SECCIONES;
        const seguridadItems = SEGURIDAD_ITEMS;
        const generando = ref(false);
        const historial = ref([]);
        const firebaseListo = firebaseListoGlobal;

        // KM Próxima Mantención: valor fijo compartido (no por checklist), editable con "Actualizar"
        const kmProximaMantencion = ref(55000);
        const editandoKmProxima = ref(false);
        const kmProximaEditVal = ref(kmProximaMantencion.value);

        // KM y Fecha de Última Mantención: también fijos y compartidos, editables juntos
        const kmUltimaMantencion = ref(45946);
        const fechaUltimaMantencion = ref('2026-05-15');
        const editandoUltimaMantencion = ref(false);
        const kmUltimaEditVal = ref(kmUltimaMantencion.value);
        const fechaUltimaEditVal = ref(fechaUltimaMantencion.value);

        if (db) {
          db.collection('config')
            .doc('mantencion')
            .onSnapshot(
              (doc) => {
                if (!doc.exists) return;
                const data = doc.data();
                if (typeof data.kmProximaMantencion === 'number') {

          lateralIzquierdo: null,

        const editandoAngulo = ref(null);
        const canvasRefs = {};
        let dibujandoTrazo = false;

        if (db) {
          db.collection('config')

            .onSnapshot(
              (doc) => {
                if (!doc.exists) return;
                const data = doc.data();

        function setCanvasRef(key, el) {

        async function abrirEdicionAngulo(angulo) {
          editandoAngulo.value = angulo.key;
          await nextTick();
          const canvas = canvasRefs[angulo.key];
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
          if (imagenesDanos[angulo.key]) {
            const img = await cargarImagen(imagenesDanos[angulo.key]);
            ctx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);
          } else {
            const img = await cargarImagen(svgDataUrl(angulo));
            if (angulo.espejado) {
              ctx.save();
              ctx.translate(CANVAS_W, 0);
              ctx.scale(-1, 1);
              ctx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);
              ctx.restore();
            } else {
              ctx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);
            }
          }
        }

        function cancelarEdicionAngulo() {
          editandoAngulo.value = null;
        }

        function guardarAngulo(key) {
          const canvas = canvasRefs[key];
          if (!canvas) return;
          const dataUrl = canvas.toDataURL('image/png');
          imagenesDanos[key] = dataUrl;
          editandoAngulo.value = null;
          if (db) {
            db.collection('config')
              .doc('danosVehiculo')
              .set({ [key]: dataUrl }, { merge: true })
              .catch((err) => console.error('Error guardando diagrama de daños:', err));
          }
        }

        function limpiarAngulo(angulo) {
          if (!confirm(`¿Limpiar el diagrama de "${angulo.label}"? Se perderán las marcas guardadas.`)) {
            return;
          }
          imagenesDanos[angulo.key] = null;
          if (editandoAngulo.value === angulo.key) editandoAngulo.value = null;
          if (db) {
            db.collection('config')
              .doc('danosVehiculo')
              .set({ [angulo.key]: null }, { merge: true })
              .catch((err) => console.error('Error limpiando diagrama de daños:', err));
          }
        }

        function coordsRelativas(e, key) {
          const canvas = canvasRefs[key];
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return {
            x: ((clientX - rect.left) * canvas.width) / rect.width,
            y: ((clientY - rect.top) * canvas.height) / rect.height,
          };
        }

        function iniciarTrazo(e, key) {
          if (editandoAngulo.value !== key) return;
          e.preventDefault();
          dibujandoTrazo = true;
          const { x, y } = coordsRelativas(e, key);
          const ctx = canvasRefs[key].getContext('2d');
          ctx.beginPath();
          ctx.moveTo(x, y);
        }

        function continuarTrazo(e, key) {
          if (!dibujandoTrazo || editandoAngulo.value !== key) return;
          e.preventDefault();
          const { x, y } = coordsRelativas(e, key);
          const ctx = canvasRefs[key].getContext('2d');
          ctx.strokeStyle = '#e03131';
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineTo(x, y);
          ctx.stroke();
        }

        function terminarTrazo() {
          dibujandoTrazo = false;

    function sugerirNombreCorto(nombreCompleto) {
      const conectores = ['del', 'de', 'la', 'los', 'las', 'y'];
      const partes = nombreCompleto.trim().split(/\s+/).filter(Boolean);
      if (partes.length < 2) return nombreCompleto.trim();

      const primerNombre = partes[0];
      let apellido = partes[partes.length - 1];
      for (let i = partes.length - 1; i > 0; i--) {
        if (!conectores.includes(partes[i].toLowerCase())) {
          apellido = partes[i];
          break;
        }
      }
      return `${primerNombre} ${apellido}`;
    }

    function fechaHoyDDMMAAAA() {
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const aaaa = d.getFullYear();
      return `${dd}/${mm}/${aaaa}`;
    }

                </div>
              </div>
            </div>
          </div>
        </div>

        <div v-else class="planilla">
        <div class="card shadow-sm planilla__card">
          <div class="card-body">
            <button type="button" class="btn btn-link btn-sm px-0 mb-2 planilla__back-btn" @click="view = 'home'">
              ← Volver a la portada
            </button>
            <h1 class="planilla__title h4 mb-4">Generador de Plantillas para Vicente Version Beta.</h1>

            <div v-if="selectedId === 'guia-despacho'" class="alert alert-info planilla__info" role="alert">
              Para solicitar traslado, se debe enviar correo a la mesa de ayuda
              <strong>servicedesk@chilquintas.cl</strong> a vicentet. Con copia a Jose, Joel y Felipe.
              Además el asunto debe seguir este formato: <strong>"GDD - Origen - Destino Fecha"</strong>.
              Sin nada más en el asunto.
            </div>

            <div class="mb-3">
              <label class="form-label planilla__label">Tipo de solicitud</label>
              <select v-model="selectedId" class="form-select planilla__select">
                <option v-for="tpl in templates" :key="tpl.id" :value="tpl.id">
                  {{ tpl.label }}
                </option>
              </select>
            </div>

            <div v-if="currentTemplate.itemColumns.length" class="planilla__items mb-3">
              <label class="form-label planilla__label">Listado de equipos</label>

              <div
                v-for="(item, index) in formState.items"
                :key="index"
                class="planilla__item-row row g-2 mb-2 align-items-center"
              >
                <div v-for="col in currentTemplate.itemColumns" :key="col.key" class="col">
                  <input
                    v-model="item[col.key]"
                    type="text"
                    class="form-control form-control-sm"
                    :placeholder="col.label"
                  />
                </div>
                <div class="col-auto">
                  <button type="button" class="btn btn-outline-danger btn-sm" @click="removeItem(index)">
                    ✕
                  </button>
                </div>
              </div>

              <button type="button" class="btn btn-outline-secondary btn-sm" @click="addItem">
                + Agregar equipo
              </button>
            </div>

            <div v-for="field in currentTemplate.extraFields" :key="field.key" class="mb-3">
              <label class="form-label planilla__label">{{ field.label }}</label>
              <textarea
                v-if="field.type === 'textarea'"
                v-model="formState[field.key]"
                class="form-control planilla__input"
                rows="3"
              ></textarea>
              <input
                v-else
                v-model="formState[field.key]"
                @input="onFieldInput(field.key)"
                type="text"
                class="form-control planilla__input"
              />
            </div>

            <hr />

            <div class="mb-2">
              <label class="form-label planilla__label">Correo generado</label>
              <textarea
                class="form-control planilla__output"
                rows="12"
                readonly
                :value="generatedText"
              ></textarea>
            </div>

            <button type="button" class="btn btn-primary planilla__copy-btn" @click="copyToClipboard">
              {{ copied ? '¡Copiado!' : 'Copiar al portapapeles' }}
            </button>
          </div>
        </div>
        </div>
      `,
      setup() {
        const templates = TEMPLATE_CONFIG;
        const selectedId = ref(templates[0].id);
        const currentTemplate = computed(() =>
          templates.find((t) => t.id === selectedId.value)
        );

        const view = ref('home');
        const formState = reactive(createEmptyState(currentTemplate.value));
        const copied = ref(false);

        function goToTemplate(id) {
          selectedId.value = id;
          view.value = 'generador';
        }

        watch(selectedId, (newId) => {
          const tpl = templates.find((t) => t.id === newId);
          Object.keys(formState).forEach((k) => delete formState[k]);
          Object.assign(formState, createEmptyState(tpl));
          copied.value = false;
        });

        watch(
          () => formState.nombreCompleto,
          (newVal) => {
            if (newVal !== undefined && !formState._nombreCortoEditado) {
              formState.nombreCorto = sugerirNombreCorto(newVal || '');
            }
          }
        );

        function onFieldInput(fieldKey) {
          if (fieldKey === 'nombreCorto') {
            formState._nombreCortoEditado = true;
          }
        }

        function addItem() {
          const emptyRow = {};
          currentTemplate.value.itemColumns.forEach((c) => (emptyRow[c.key] = ''));
          formState.items.push(emptyRow);
        }

        function removeItem(index) {
          formState.items.splice(index, 1);
        }

        const generatedText = computed(() => currentTemplate.value.generate(formState));

        async function copyToClipboard() {
          await navigator.clipboard.writeText(generatedText.value);
          copied.value = true;
          setTimeout(() => (copied.value = false), 2000);
        }

        return {
          templates,
          selectedId,
          currentTemplate,
          view,
          goToTemplate,
          formState,
          copied,
          addItem,
          removeItem,
          onFieldInput,
          generatedText,
          copyToClipboard,
        };
      },
    };

    /* =========================================================
       ROUTER + APP
       ========================================================= */

    const router = VueRouter.createRouter({
      history: VueRouter.createWebHashHistory(),
      routes: [
        { path: '/', component: ChecklistVehiculo },
        { path: '/plantillas', component: GeneradorPlantillas },
      ],
    });

    createApp({}).use(router).mount('#app');
  </script>

          <p class="text-muted mb-4">Inicia sesión con tu cuenta Google autorizada para continuar.</p>
          <button type="button" class="btn btn-primary" @click="iniciarSesionGoogle">

        </div>

    </div>

    <template v-else>

  <script>
    // ---- Firebase ----
    const firebaseConfig = {
      apiKey: 'AIzaSyDbbr25X6wQlgYqhIVy--jV1Yt9v3gBstM',
      authDomain: 'checklist-vehiculo-provectis.firebaseapp.com',
      projectId: 'checklist-vehiculo-provectis',
      storageBucket: 'checklist-vehiculo-provectis.firebasestorage.app',
      messagingSenderId: '942275989057',
      appId: '1:942275989057:web:c5e052c2e5cdcbdf7cc0c0',
    };

    let db = null;
    const firebaseListoGlobal = firebaseConfig.apiKey !== 'TU_API_KEY';
    if (firebaseListoGlobal) {
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
      } catch (err) {
        console.error('No se pudo inicializar Firebase:', err);
      }
    }

    const { createApp, reactive, ref, computed, watch, nextTick } = Vue;

    // ---- Login con Google + roles ----
    // Admins "raíz": SIEMPRE tienen rol admin, sin depender de Firestore.
    // Son los únicos que pueden editar la lista de usuarios autorizados (ver reglas de Firestore).
    const ADMINS_RAIZ = ['mario.canto2008@gmail.com', 'imgtest90@gmail.com'];

    const AUTH = reactive({ usuario: null, rol: null, cargando: true });

    // Lista de usuarios autorizados (además de los admins raíz), gestionada desde Firestore.
    const usuariosAutorizadosState = reactive({ mapa: {} });

    let auth = null;
    if (firebaseListoGlobal) {
      try {
        auth = firebase.auth();
        auth.onAuthStateChanged(async (user) => {
          if (!user) {
            AUTH.usuario = null;
            AUTH.rol = null;
            AUTH.cargando = false;
            return;
          }

          if (ADMINS_RAIZ.includes(user.email)) {
            AUTH.usuario = user;
            AUTH.rol = 'admin';
            AUTH.cargando = false;
            iniciarListenersGlobales();
            return;
          }

          try {
            const doc = await db.collection('config').doc('usuariosAutorizados').get();
            const mapa = doc.exists ? doc.data() : {};
            const rol = mapa[user.email];
            if (rol) {
              AUTH.usuario = user;
              AUTH.rol = rol;
              iniciarListenersGlobales();
            } else {
              AUTH.usuario = null;
              AUTH.rol = null;
              auth.signOut();
              alert(`La cuenta ${user.email} no está autorizada para usar esta app.`);
            }
          } catch (err) {
            console.error('Error verificando autorización:', err);
            AUTH.usuario = null;
            AUTH.rol = null;
            auth.signOut();
            alert('No se pudo verificar tu autorización. Intenta de nuevo.');
          }
          AUTH.cargando = false;
        });
      } catch (err) {
        console.error('No se pudo inicializar Firebase Auth:', err);
        AUTH.cargando = false;
      }
    } else {
      AUTH.cargando = false;
    }

    function iniciarSesionGoogle() {
      if (!auth) return;
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch((err) => console.error('Error de login:', err));
    }

    function cerrarSesion() {
      if (auth) auth.signOut();
    }

    // ---- Técnicos autorizados (compartido entre las 3 vistas, editable con Actualizar) ----
    const tecnicosState = reactive({ lista: ['Mario Canto'] });
    let listenersGlobalesIniciados = false;

    // Se llama recién cuando la sesión ya está confirmada (o si Firebase no está configurado),
    // para no leer Firestore antes de tener permisos.
    function iniciarListenersGlobales() {
      if (listenersGlobalesIniciados || !db) return;
      listenersGlobalesIniciados = true;
      db.collection('config')
        .doc('tecnicos')
        .onSnapshot(
          (doc) => {
            if (doc.exists && Array.isArray(doc.data().lista)) {
              tecnicosState.lista = doc.data().lista;
            }
          },
          (err) => console.error('Error leyendo técnicos autorizados:', err)
        );
      db.collection('config')
        .doc('usuariosAutorizados')
        .onSnapshot(
          (doc) => {
            usuariosAutorizadosState.mapa = doc.exists ? doc.data() : {};
          },
          (err) => console.error('Error leyendo usuarios autorizados:', err)
        );
    }

    // Solo funcionan si quien está logueado es uno de los ADMINS_RAIZ (ver reglas de Firestore).
    function agregarUsuarioAutorizado(email, rol) {
      const limpio = (email || '').trim().toLowerCase();
      if (!limpio) return;
      if (!db) return;
      db.collection('config')
        .doc('usuariosAutorizados')
        .set({ [limpio]: rol }, { merge: true })
        .catch((err) => console.error('Error agregando usuario autorizado:', err));
    }

    function quitarUsuarioAutorizado(email) {
      if (!db) return;
      db.collection('config')
        .doc('usuariosAutorizados')
        .update({ [email]: firebase.firestore.FieldValue.delete() })
        .catch((err) => console.error('Error quitando usuario autorizado:', err));
    }

    function guardarTecnicos() {
      if (db) {
        db.collection('config')
          .doc('tecnicos')
          .set({ lista: tecnicosState.lista }, { merge: true })
          .catch((err) => console.error('Error guardando técnicos autorizados:', err));
      }
    }

    function agregarTecnico(nombre) {
      const limpio = (nombre || '').trim();
      if (!limpio || tecnicosState.lista.includes(limpio)) return;
      tecnicosState.lista.push(limpio);
      tecnicosState.lista.sort();
      guardarTecnicos();
    }

    function quitarTecnico(nombre) {
      tecnicosState.lista = tecnicosState.lista.filter((t) => t !== nombre);
      guardarTecnicos();
    }

    const ANGULOS_VEHICULO = [
      { key: 'frente', label: 'Frente', imagenBase: FOTO_FRENTE },
      { key: 'atras', label: 'Atrás', imagenBase: FOTO_ATRAS },
      { key: 'lateralDerecho', label: 'Costado Derecho', imagenBase: FOTO_LATERAL_DERECHO },
      { key: 'lateralIzquierdo', label: 'Costado Izquierdo', imagenBase: FOTO_LATERAL_IZQUIERDO },
    ];

    function cargarImagen(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = src;
      });
    }

    function tipoImagenPDF(dataUrl) {
      return dataUrl.startsWith('data:image/png') ? 'PNG' : 'JPEG';
    }

    function crearEstadoInicial() {
      const form = {
        nombreTecnico: '',
        fecha: new Date().toISOString().slice(0, 10),
        patente: 'TZ-WS-55',
        ciudad: 'Valparaíso',
        proyecto: 'Chilquinta',
        kmActual: '',
        observaciones: '',
      };
      SECCIONES.forEach((section) => {
        form[section.key] = {};
        section.items.forEach((item) => {
          form[section.key][item.key] = false;
        });
      });

      form.seguridad = {};
      SEGURIDAD_ITEMS.forEach((item) => {
        form.seguridad[item.key] = 'buen';
      });

      return form;
    }

    function formatearFecha(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      return `${d}-${m}-${y}`;
    }

    const SelectorTecnico = {
      props: ['modelValue'],
      emits: ['update:modelValue'],
      template: `
        <div class="checklist__selector-tecnico">
          <select
            :value="modelValue"
            @change="$emit('update:modelValue', $event.target.value)"
            class="form-select"
          >
            <option value="" disabled>Selecciona un técnico</option>
            <option v-for="t in tecnicos" :key="t" :value="t">{{ t }}</option>
          </select>
          <button
            type="button"
            class="btn btn-link btn-sm p-0 mt-1"
            @click="mostrarGestion = !mostrarGestion"
          >
            {{ mostrarGestion ? 'Ocultar gestión' : 'Gestionar técnicos' }}
          </button>
          <div v-if="mostrarGestion" class="checklist__tecnicos-panel mt-2 p-2">
            <div class="d-flex flex-wrap gap-1 mb-2">
              <span
                v-for="t in tecnicos"
                :key="t"
                class="badge bg-secondary d-flex align-items-center"
              >
                {{ t }}
                <button
                  type="button"
                  class="btn-close btn-close-white ms-1"
                  style="font-size: 0.55rem"
                  @click="quitarTecnico(t)"
                ></button>
              </span>
            </div>
            <div class="input-group input-group-sm">
              <input
                v-model="nuevoNombre"
                type="text"
                class="form-control"
                placeholder="Nombre nuevo técnico"
                @keyup.enter="agregar"
              />
              <button class="btn btn-outline-primary" type="button" @click="agregar">
                Agregar
              </button>
            </div>
          </div>
        </div>
      `,
      setup() {
        const tecnicos = computed(() => tecnicosState.lista);
        const mostrarGestion = ref(false);
        const nuevoNombre = ref('');
        function agregar() {
          agregarTecnico(nuevoNombre.value);

          return parseFloat(String(valor).replace(',', '.'));

          const actual = Number(cargaForm.odometroActual);
          if (!anterior || !actual || actual <= anterior) return null;
          return actual - anterior;

                // Sugiere el odómetro anterior automáticamente con la última carga registrada
                // (solo si no se está editando una carga existente)
                if (!cargaIdActual.value && !cargaForm.odometroAnterior && historialCombustible.value[0]) {
                  cargaForm.odometroAnterior = historialCombustible.value[0].odometroActual;
                }
              },
              (err) => console.error('Error escuchando cargas de combustible:', err)
            );
        }

        function cargarCarga(entry) {
          Object.keys(cargaForm).forEach((k) => delete cargaForm[k]);
          Object.assign(cargaForm, crearCargaVacia(''));
          Object.keys(cargaForm).forEach((k) => {
            if (k in entry) cargaForm[k] = entry[k];
          });
          cargaIdActual.value = entry.id;
          errorValidacionCombustible.value = '';
        }

        function cancelarEdicionCarga() {
          const ultimoOdometro = historialCombustible.value[0] ? historialCombustible.value[0].odometroActual : '';
          Object.keys(cargaForm).forEach((k) => delete cargaForm[k]);
          Object.assign(cargaForm, crearCargaVacia(ultimoOdometro));
          cargaIdActual.value = null;
          errorValidacionCombustible.value = '';
        }

        function guardarCarga() {
          errorValidacionCombustible.value = '';
          const litrosNum = parseNumeroDecimal(cargaForm.litros);
          if (
            !cargaForm.fecha ||
            !cargaForm.odometroActual ||
            !cargaForm.litros ||
            Number.isNaN(litrosNum) ||
            !cargaForm.precioUnitario ||
            !cargaForm.total
          ) {
            errorValidacionCombustible.value =
              'Completa fecha, odómetro actual, litros, precio unitario y total antes de guardar.';
            return;
          }
          if (!db) return;
          guardandoCombustible.value = true;
          const snapshot = JSON.parse(JSON.stringify(cargaForm));
          const datos = {
            ...snapshot,
            litros: litrosNum,
            patente: form.patente,
          };

          const promesa = cargaIdActual.value
            ? db
                .collection('cargasCombustible')
                .doc(cargaIdActual.value)
                .set(
                  { ...datos, actualizadoEn: firebase.firestore.FieldValue.serverTimestamp() },
                  { merge: true }
                )
            : db.collection('cargasCombustible').add({
                ...datos,
                creadoEn: firebase.firestore.FieldValue.serverTimestamp(),
              });

          promesa
            .then(() => {
              const ultimoOdometro = cargaForm.odometroActual;
              Object.keys(cargaForm).forEach((k) => delete cargaForm[k]);
              Object.assign(cargaForm, crearCargaVacia(ultimoOdometro));
              cargaIdActual.value = null;
            })

            .doc(entry.id)
            .delete()
            .then(() => {

        async function abrirEdicionAngulo(angulo) {
          editandoAngulo.value = angulo.key;

          const canvas = canvasRefs[angulo.key];

          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
          const src = imagenesDanos[angulo.key] || angulo.imagenBase;
          const img = await cargarImagen(src);
          ctx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);

        function guardarAngulo(key) {
          const canvas = canvasRefs[key];
          if (!canvas) return;

          if (!confirm(`¿Limpiar el diagrama de "${angulo.label}"? Se perderán las marcas guardadas.`)) {
            return;

          imagenesDanos[angulo.key] = null;
          if (editandoAngulo.value === angulo.key) editandoAngulo.value = null;
          if (db) {
            db.collection('config')
              .doc('danosVehiculo')
              .set({ [angulo.key]: null }, { merge: true })
              .catch((err) => console.error('Error limpiando diagrama de daños:', err));
          }
        }

        function coordsRelativas(e, key) {
          const canvas = canvasRefs[key];
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return {
            x: ((clientX - rect.left) * canvas.width) / rect.width,
            y: ((clientY - rect.top) * canvas.height) / rect.height,
          };
        }

        function iniciarTrazo(e, key) {
          if (editandoAngulo.value !== key) return;
          e.preventDefault();
          dibujandoTrazo = true;
          const { x, y } = coordsRelativas(e, key);
          const ctx = canvasRefs[key].getContext('2d');
          ctx.beginPath();
          ctx.moveTo(x, y);
        }

        function continuarTrazo(e, key) {
          if (!dibujandoTrazo || editandoAngulo.value !== key) return;
          e.preventDefault();
          const { x, y } = coordsRelativas(e, key);
          const ctx = canvasRefs[key].getContext('2d');
          ctx.strokeStyle = '#e03131';
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineTo(x, y);
          ctx.stroke();
        }

    function sugerirNombreCorto(nombreCompleto) {
      const conectores = ['del', 'de', 'la', 'los', 'las', 'y'];
      const partes = nombreCompleto.trim().split(/\s+/).filter(Boolean);
      if (partes.length < 2) return nombreCompleto.trim();

      const primerNombre = partes[0];
      let apellido = partes[partes.length - 1];
      for (let i = partes.length - 1; i > 0; i--) {
        if (!conectores.includes(partes[i].toLowerCase())) {
          apellido = partes[i];
          break;
        }
      }
      return `${primerNombre} ${apellido}`;
    }

    function fechaHoyDDMMAAAA() {
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const aaaa = d.getFullYear();
      return `${dd}/${mm}/${aaaa}`;
    }

                historial.value = snap.docs.map((d) => ({ id: d.id, ...d.data() }));

            );

          ticketEncontrado.value = null;
          if (!db || !form.ticket) return;
          if (modoEdicion.value && form.ticket === ticketCargado.value) return;
          try {
            const doc = await db.collection('historialEquipos').doc(String(form.ticket)).get();
            if (doc.exists) {
              ticketEncontrado.value = { id: doc.id, ...doc.data() };
            }
          } catch (err) {
            console.error('Error buscando ticket:', err);

          Object.keys(form).forEach((k) => {
            if (k in entry) form[k] = entry[k];
          });
          modoEdicion.value = true;
          ticketCargado.value = entry.ticket;
          ticketEncontrado.value = null;
        }

          Object.keys(form).forEach((k) => delete form[k]);

            body: [
              ['Hostname', data.hostname, 'Fecha', formatearFecha(data.fecha)],
              ['Modelo', data.modelo, 'S/N', data.numeroSerie],
              ['S.O / WIN', data.soWin, '', ''],
            ],
          });

          let cursorY = doc.lastAutoTable.finalY + 20;

          secciones.forEach((section) => {
            if (cursorY > 700) {
              doc.addPage();
              cursorY = 40;
            }
            doc.setFontSize(10);
            doc.text(section.label, 40, cursorY);

            const body = section.items.map((item) => [
              item.label,
              data[section.key][item.key] ? 'Sí' : 'No',
            ]);

            doc.autoTable({
              startY: cursorY + 8,
              theme: 'grid',
              styles: { fontSize: 8 },
              head: [['Ítem', 'Sí/No']],
              body,
              columnStyles: { 0: { cellWidth: 440 }, 1: { cellWidth: 40 } },
              margin: { left: 40, right: 40 },
            });

            cursorY = doc.lastAutoTable.finalY + 20;
          });

          if (cursorY > 740) {
            doc.addPage();
            cursorY = 40;
          }
          doc.setFontSize(9);
          doc.text(`Nombre y Firma Soporte TI: ${data.nombreSoporte}`, 40, cursorY);

          return doc;
        }

        // Crea el registro si el ticket es nuevo, o actualiza el mismo documento si se está editando.
        // nombreArchivo es opcional: al usar el botón "Guardar" (sin generar PDF) no se pisa el campo archivo.
        function guardarHistorial(nombreArchivo) {
          if (!db) return Promise.resolve();
          const snapshot = JSON.parse(JSON.stringify(form));
          const ref = db.collection('historialEquipos').doc(String(form.ticket));
          const datos = {
            ...snapshot,
            actualizadoEn: firebase.firestore.FieldValue.serverTimestamp(),
          };
          if (nombreArchivo) datos.archivo = nombreArchivo;
          if (!modoEdicion.value) {
            datos.creadoEn = firebase.firestore.FieldValue.serverTimestamp();
          }
          return ref
            .set(datos, { merge: true })
            .then(() => {
              modoEdicion.value = true;
              ticketCargado.value = form.ticket;
            })
            .catch((err) => console.error('Error guardando historial de equipos:', err));
        }

        async function guardarSolo() {
          errorValidacion.value = '';
          if (!form.ticket) {
            errorValidacion.value = 'Ingresa el número de Ticket antes de guardar.';
            return;
          }
          guardando.value = true;
          try {
            await guardarHistorial();
          } finally {
            guardando.value = false;
          }
        }

        function generarPDF() {
          errorValidacion.value = '';
          if (!form.ticket) {
            errorValidacion.value = 'Ingresa el número de Ticket antes de generar el PDF.';
            return;
          }
          generando.value = true;
          try {
            const doc = crearPDFDesdeDatos(form);
            const nombreArchivo = `checklist_equipo_${form.ticket}_${form.fecha}.pdf`;
            doc.save(nombreArchivo);
            guardarHistorial(nombreArchivo);
          } finally {
            generando.value = false;
          }
        }

        function descargarDesdeHistorial(entry) {
          const doc = crearPDFDesdeDatos(entry);
          doc.save(entry.archivo || `checklist_equipo_${entry.ticket}_${entry.fecha}.pdf`);
        }

        function borrarDelHistorial(entry) {
          if (!db) return;
          if (!confirm(`¿Borrar el checklist del ticket #${entry.ticket}? Esta acción no se puede deshacer.`)) {
            return;
          }
          db.collection('historialEquipos')
            .doc(entry.id)
            .delete()
            .then(() => {
              if (modoEdicion.value && ticketCargado.value === entry.ticket) {
                nuevoChecklist();
              }
            })
            .catch((err) => console.error('Error borrando checklist de equipo:', err));
        }

        return {
          form,
          secciones,
          generando,
          guardando,
          generarPDF,
          guardarSolo,
          isSectionAllChecked,
          toggleSection,
          historial,
          firebaseListo,
          esAdmin,
          descargarDesdeHistorial,
          borrarDelHistorial,
          errorValidacion,
          ticketEncontrado,
          modoEdicion,
          ticketCargado,
          buscarTicket,
          cargarChecklist,
          nuevoChecklist,
        };
      },
    };

    const SeguimientoCasos = {
      components: { SelectorTecnico },
      template: `
        <div class="checklist">
          <div class="card shadow-sm checklist__card">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start mb-1">
                <h1 class="checklist__title h4 mb-1">Seguimiento de Casos</h1>
                <button type="button" class="btn btn-outline-secondary btn-sm" @click="nuevoCaso">
                  + Nuevo Caso
                </button>
              </div>
              <p class="checklist__subtitle text-muted mb-4">
                Sigue el avance de cada atención hasta que todas las etapas queden completas.
              </p>

              <div v-if="casoIdActual" class="alert alert-warning d-flex justify-content-between align-items-center py-2 mb-3" role="alert">
                <span>✏️ Editando caso guardado</span>
                <button type="button" class="btn btn-sm btn-outline-secondary" @click="nuevoCaso">
                  Cancelar edición / Nuevo caso
                </button>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-4">
                  <label class="form-label checklist__label">Nombre de Usuario</label>
                  <input v-model="form.nombreUsuario" type="text" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label checklist__label">Equipo a Asignar</label>
                  <input v-model="form.equipoAsignar" type="text" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label checklist__label">Lugar o Ticket</label>
                  <input v-model="form.lugarTicket" type="text" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label class="form-label checklist__label">Técnico a cargo</label>
                  <selector-tecnico v-model="form.tecnico"></selector-tecnico>
                </div>
                <div class="col-md-4">
                  <label class="form-label checklist__label">Fecha</label>
                  <input v-model="form.fecha" type="date" class="form-control" />
                </div>
              </div>

              <div v-if="errorValidacion" class="text-danger small mb-3">{{ errorValidacion }}</div>

              <div class="row row-cols-2 row-cols-md-6 g-2 mb-4">
                <div class="col" v-for="etapa in etapas" :key="etapa.key">
                  <button
                    type="button"
                    class="btn btn-sm w-100 mb-2 checklist__etapa-btn"
                    :class="etapaCompleta(etapa) ? 'btn-success' : 'btn-warning'"
                    disabled
                  >
                    {{ etapa.label }}
                  </button>
                  <div class="text-center mb-2">
                    <a href="#" class="checklist__etapa-link small" @click.prevent="irAEtapa(etapa)">
                      Ir a {{ etapa.linkLabel }} →
                    </a>
                  </div>
                  <div class="checklist__etapa-items">
                    <div v-for="item in etapa.items" :key="item.key" class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        :id="etapa.key + '-' + item.key"
                        v-model="form[etapa.key][item.key]"
                      />
                      <label class="form-check-label small" :for="etapa.key + '-' + item.key">
                        {{ item.label }}
                      </label>
                    </div>
                    <input
                      v-for="item in etapa.items.filter((i) => i.campoTexto)"
                      :key="item.campoTexto"
                      v-model="form[etapa.key][item.campoTexto]"
                      type="text"
                      class="form-control form-control-sm mt-1"
                      :placeholder="item.campoTextoLabel"
                    />
                  </div>
                </div>
              </div>

              <hr />

              <button type="button" class="btn btn-primary checklist__pdf-btn" @click="guardarCaso">
                Guardar
              </button>
              <span v-if="guardando" class="text-muted ms-2">Guardando…</span>

              <div class="mt-4 checklist__historial">
                <h2 class="h6 text-uppercase text-muted mb-2">Historial de Casos</h2>

                <p v-if="!firebaseListo" class="text-muted small">
                  El historial en la nube está desactivado: falta configurar
                  <code>firebaseConfig</code> en el código.
                </p>

                <p v-else-if="!historial.length" class="text-muted small">
                  Aún no hay casos guardados.
                </p>

                <div v-else class="table-responsive">
                  <table class="table table-sm table-hover align-middle">
                    <thead>
                      <tr>
                        <th>Usuario</th>
                        <th>Técnico</th>
                        <th>Lugar/Ticket</th>
                        <th>Avance</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr v-for="entry in historial" :key="entry.id">
                        <td>{{ entry.nombreUsuario }}</td>
                        <td>{{ entry.tecnico }}</td>
                        <td>{{ entry.lugarTicket }}</td>
                        <td>
                          <span
                            class="badge"
                            :class="contarEtapasCompletas(entry) === 6 ? 'bg-success' : 'bg-secondary'"
                          >
                            {{ contarEtapasCompletas(entry) }}/6
                          </span>
                        </td>
                        <td class="text-end">
                          <button
                            class="btn btn-sm btn-outline-primary me-1"
                            @click="cargarCaso(entry)"
                          >
                            Editar
                          </button>
                          <button
                            v-if="esAdmin"
                            class="btn btn-sm btn-outline-danger"
                            @click="borrarCaso(entry)"
                          >
                            Borrar
                          </button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      `,
      setup() {
        const router = VueRouter.useRouter();
        const form = reactive(crearCasoVacio());
        const etapas = ETAPAS_SEGUIMIENTO;
        const guardando = ref(false);
        const historial = ref([]);
        const firebaseListo = firebaseListoGlobal;
        const esAdmin = computed(() => AUTH.rol === 'admin');
        const errorValidacion = ref('');
        const casoIdActual = ref(null);

        if (db) {
          db.collection('seguimientoCasos')
            .orderBy('creadoEn', 'desc')
            .limit(50)
            .onSnapshot(
              (snap) => {
                historial.value = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
              },
              (err) => console.error('Error escuchando historial de casos:', err)
            );
        }

        function etapaCompleta(etapa) {
          return etapaCompletaEn(form, etapa);
        }

        function irAEtapa(etapa) {
          if (etapa.ruta) {
            router.push({ path: etapa.ruta, query: { ticket: form.lugarTicket || undefined } });
            return;
          }
          router.push({
            path: '/plantillas',
            query: { tpl: etapa.plantillaId, nombre: form.nombreUsuario || undefined },
          });
        }

        function nuevoCaso() {
          Object.keys(form).forEach((k) => delete form[k]);
          Object.assign(form, crearCasoVacio());
          casoIdActual.value = null;
          errorValidacion.value = '';
        }

        function cargarCaso(entry) {
          Object.keys(form).forEach((k) => delete form[k]);
          Object.assign(form, JSON.parse(JSON.stringify(crearCasoVacio())));
          Object.keys(form).forEach((k) => {
            if (k in entry) form[k] = entry[k];
          });
          casoIdActual.value = entry.id;
          errorValidacion.value = '';
        }

        function guardarCaso() {
          errorValidacion.value = '';
          if (!form.nombreUsuario) {
            errorValidacion.value = 'Ingresa el nombre de usuario antes de guardar.';
            return;
          }
          if (!db) return;
          guardando.value = true;
          const id = casoIdActual.value || generarIdCaso();
          const snapshot = JSON.parse(JSON.stringify(form));
          const datos = {
            ...snapshot,
            actualizadoEn: firebase.firestore.FieldValue.serverTimestamp(),
          };
          if (!casoIdActual.value) {
            datos.creadoEn = firebase.firestore.FieldValue.serverTimestamp();
          }
          db.collection('seguimientoCasos')
            .doc(id)
            .set(datos, { merge: true })
            .then(() => {
              casoIdActual.value = id;
            })
            .catch((err) => console.error('Error guardando caso:', err))
            .finally(() => {
              guardando.value = false;
            });
        }

        function borrarCaso(entry) {
          if (!db) return;
          if (!confirm(`¿Borrar el caso de "${entry.nombreUsuario}"? Esta acción no se puede deshacer.`)) {
            return;
          }
          db.collection('seguimientoCasos')
            .doc(entry.id)
            .delete()
            .then(() => {
              if (casoIdActual.value === entry.id) nuevoCaso();
            })
            .catch((err) => console.error('Error borrando caso:', err));
        }

        return {
          form,
          etapas,
          guardando,
          historial,
          firebaseListo,
          esAdmin,
          errorValidacion,
          casoIdActual,
          etapaCompleta,
          contarEtapasCompletas,
          irAEtapa,
          nuevoCaso,
          cargarCaso,
          guardarCaso,
          borrarCaso,
        };
      },
    };

    /* =========================================================
       ROUTER + APP
       ========================================================= */

    const router = VueRouter.createRouter({
      history: VueRouter.createWebHashHistory(),
      routes: [
        { path: '/', component: ChecklistVehiculo },
        { path: '/plantillas', component: GeneradorPlantillas },
        { path: '/equipos', component: ChecklistEquipo },
        { path: '/seguimiento', component: SeguimientoCasos },
      ],
    });

    createApp({
      setup() {
        return {
          cargando: computed(() => AUTH.cargando),
          puedeUsarApp: computed(() => !firebaseListoGlobal || !!AUTH.usuario),
          usuario: computed(() => AUTH.usuario),
          rol: computed(() => AUTH.rol),
          iniciarSesionGoogle,
          cerrarSesion,
        };
      },
    })
      .use(router)
      .mount('#app');
  </script>
